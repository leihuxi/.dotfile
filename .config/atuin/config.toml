# atuin：Ctrl-r 打开历史搜索（仅本地，不同步）
auto_sync = false
update_check = false
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
style = "compact"
inline_height = 20
show_preview = true
show_help = true
enter_accept = false          # 回车只放到命令行，确认后再执行
keymap_mode = "vim-insert"    # 和 zsh vi-mode 一致：Esc 进入普通模式
history_filter = ["^ls$", "^ll$", "^cd$", "^exit$", "^clear$"]

[theme]
name = "catppuccin-mocha-blue"
