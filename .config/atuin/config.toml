# atuin: Ctrl-r opens history search (local only, no sync)
auto_sync = false
update_check = false
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
style = "compact"
inline_height = 20
show_preview = true
show_help = true
enter_accept = false          # Enter puts the command on the prompt instead of running it
keymap_mode = "vim-insert"    # matches zsh vi-mode: Esc enters normal mode
history_filter = ["^ls$", "^ll$", "^cd$", "^exit$", "^clear$"]

[theme]
name = "catppuccin-mocha-blue"
